<!doctype html>
<html lang="zh-CN">

        <a href="#/overview" data-route="overview">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
          <span>安全概览</span>
        </a>
        <a href="#/assets" data-route="assets">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5.5C5 4.7 5.7 4 6.5 4h7L19 9.5v9c0 .8-.7 1.5-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5v-13Z" stroke="currentColor" stroke-width="1.7"/><path d="M13 4v6h6M8 13h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>

        <a href="#/sandbox" data-route="sandbox">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="m9 10 2 2-2 2M13 15h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

          <p id="page-subtitle">统一查看数据流转、出域风险与安全策略运行状态</p>
        </div>
        <div class="topbar-actions">
          <span class="env-pill api-pending" id="api-status" title="等待首个 API 请求"><i></i><span id="api-status-text">API 连接中</span></span>
          <span class="operator"><span class="avatar">A</span><span><strong>alice</strong><small>安全管理员</small></span></span>
        </div>
      </header>

      <main id="page-content" class="page-content" aria-live="polite"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script src="/static/app.js"></script>

</html>
